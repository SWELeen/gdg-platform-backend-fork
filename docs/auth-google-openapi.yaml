openapi: 3.1.0
info:
  title: GDG Google Authentication API
  version: 1.0.0
  description: Google OAuth session exchange and first-time GDG profile completion. Supabase Auth owns provider credentials; NestJS verifies identity and creates local profile records.
servers:
  - url: http://localhost:3001
paths:
  /auth/google/session:
    post:
      operationId: establishGoogleSession
      summary: Verify a Supabase Google session and start a GDG session
      description: Accepts the Supabase access and refresh tokens returned by the Google OAuth callback, verifies that the identity is Google-backed and the email is verified, rotates the session, and sets the existing HttpOnly GDG cookies. A matching local person with the same Supabase user ID signs in; a new identity must complete a profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessToken, refreshToken]
              properties:
                accessToken:
                  type: string
                  maxLength: 8192
                refreshToken:
                  type: string
                  maxLength: 8192
      responses:
        '200':
          description: Session cookies set. New identities receive profile details to prefill the completion form.
          headers:
            Set-Cookie:
              description: HttpOnly gdg_access and gdg_refresh cookies.
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSessionSuccess'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '401':
          description: Invalid, expired, unverified, or non-Google Supabase identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '409':
          description: The email belongs to a local person with a different or missing Supabase identity. Existing accounts are never linked by email alone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '429':
          description: Request limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '503':
          description: Authentication rate-limit storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
  /auth/google/complete-signup:
    post:
      operationId: completeGoogleSignup
      summary: Create a GDG profile for a verified Google identity
      description: Requires the gdg_access cookie issued by the Google session operation. The server derives and verifies the personal email from Supabase, then creates the person and either a non-member registration or pending membership application. A Google identity is not linked to an existing local person by email alone.
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignupCompletionRequest'
      responses:
        '200':
          description: Profile completed. Member registrations are pending approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSignupCompletionSuccess'
        '400':
          description: Invalid profile, committee selection, or duplicate personal and university email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '401':
          description: Missing or invalid Google session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '409':
          description: The email belongs to a different local account or the signup conflicts with an existing person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '429':
          description: Request limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '503':
          description: Authentication rate-limit storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: gdg_access
  schemas:
    GoogleSessionSuccess:
      type: object
      required: [success, message, data, error]
      properties:
        success:
          const: true
        message:
          type: string
        data:
          oneOf:
            - type: object
              required: [nextStep]
              properties:
                nextStep:
                  const: SIGNED_IN
            - type: object
              required: [nextStep, profile]
              properties:
                nextStep:
                  const: COMPLETE_PROFILE
                profile:
                  type: object
                  required: [email, fullName]
                  properties:
                    email:
                      type: string
                      format: email
                    fullName:
                      type: string
        error:
          type: 'null'
    GoogleSignupCompletionRequest:
      type: object
      additionalProperties: false
      required: [fullName, registrationType, applicationData]
      properties:
        fullName:
          type: string
          maxLength: 255
        registrationType:
          enum: [MEMBER, NON_MEMBER]
        applicationData:
          type: object
          additionalProperties: false
          required: [phoneNumber, university, college, major, level, gender]
          properties:
            phoneNumber:
              type: string
              pattern: '^\+9665\d{8}$'
            universityEmail:
              type: string
              format: email
              maxLength: 255
            university:
              type: string
              maxLength: 255
            branch:
              type: string
              maxLength: 100
            college:
              type: string
              maxLength: 255
            major:
              type: string
              maxLength: 255
            level:
              type: string
              maxLength: 30
            gender:
              enum: [female, male]
            skillsByCommittee:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        committees:
          type: array
          uniqueItems: true
          items:
            type: object
            required: [committeeCode, requestedRole]
            properties:
              committeeCode:
                type: string
                pattern: '^[A-Z0-9_]{1,20}$'
              requestedRole:
                enum: [Leader, Co-Leader, Advisor, Member]
        requestedGlobalRoles:
          type: array
          uniqueItems: true
          items:
            enum: [ADVISOR, DEVELOPER_COMMITTEES_LEADER]
    GoogleSignupCompletionSuccess:
      type: object
      required: [success, message, data, error]
      properties:
        success:
          const: true
        message:
          type: string
        data:
          type: object
          required: [registrationPendingApproval]
          properties:
            registrationPendingApproval:
              type: boolean
        error:
          type: 'null'
    ApiFailure:
      type: object
      required: [success, message, data, error]
      properties:
        success:
          const: false
        message:
          type: string
        data:
          type: 'null'
        error:
          type: object
          required: [code, details]
          properties:
            code:
              type: string
            details:
              type: array
              items:
                type: object
                required: [pointer, message]
                properties:
                  pointer:
                    type: string
                  message:
                    type: string
